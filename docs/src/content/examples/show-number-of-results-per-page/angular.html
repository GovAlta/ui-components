<goab-table width="100%" mb="xl">
  <thead>
    <tr>
      <th>First name</th>
      <th>Last name</th>
      <th>Age</th>
    </tr>
  </thead>
  <tbody>
    @for (user of pageUsers; track $index) {
    <tr>
      <td>{{ user.firstName }}</td>
      <td>{{ user.lastName }}</td>
      <td>{{ user.age }}</td>
    </tr>
    }
  </tbody>
</goab-table>

<goab-grid minChildWidth="23rem">
  <goab-block alignment="center">
    Show
    <goab-dropdown
      (onChange)="handlePerPageCountChangeEvent($event)"
      [value]="perPage.toString()"
      width="9ch"
      size="compact"
    >
      <goab-dropdown-item value="10" label="10"></goab-dropdown-item>
      <goab-dropdown-item value="20" label="20"></goab-dropdown-item>
      <goab-dropdown-item value="30" label="30"></goab-dropdown-item>
    </goab-dropdown>
    <span>per page</span>
  </goab-block>
  <goab-block direction="column" alignment="end" width="100%">
    <goab-pagination
      [itemCount]="users.length"
      [perPageCount]="perPage"
      [pageNumber]="page"
      (onChange)="handlePageChange($event)"
    >
    </goab-pagination>
  </goab-block>
</goab-grid>
