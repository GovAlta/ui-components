<!DOCTYPE html><html lang="en"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Public form preview</title><script type="module" src="/ui-components/pr-preview/pr-4327/_astro/PreviewLayout.astro_astro_type_script_index_0_lang.BKovbyOZ.js"></script><script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@8.1.0/dist/ionicons/ionicons.esm.js" integrity="sha384-QeK0N4dchhCMcoF1OkHAcgwR00gJv1uQr15TCJ5CXEcLF0wm8HC4QbtQzJMCTO+c" crossorigin="anonymous"></script><link rel="stylesheet" href="/ui-components/pr-preview/pr-4327/_astro/index.D9H1Syly.css"><style>.iframe-fill{flex:1;width:100%;border:0;display:block;background:#fff}
</style><link rel="stylesheet" href="/ui-components/pr-preview/pr-4327/_astro/PreviewLayout.DxuGTVlE.css"></head> <body class="preview-doc"> <header class="preview-bar"> <goa-link size="small" leadingicon="arrow-back"> <a href="/ui-components/pr-preview/pr-4327/examples/public-form" data-back-link> <span class="back-link-label">Back to Public form</span> </a> </goa-link> <div class="preview-bar-actions">    </div> </header> <script>
      document.addEventListener("DOMContentLoaded", () => {
        const ref = document.referrer;
        if (!ref || !ref.startsWith(window.location.origin + "/examples")) return;
        const url = new URL(ref);
        if (url.pathname.endsWith("/preview") || url.pathname.endsWith("/preview/")) return;
        const path = url.pathname.replace(/\/$/, "");
        const segments = path.split("/").filter(Boolean);
        const last = segments[segments.length - 1] || "";
        const label = last
          ? last.replace(/-/g, " ").replace(/\b\w/g, (c) => c.toUpperCase())
          : "Examples";
        const link = document.querySelector("[data-back-link]");
        const labelEl = document.querySelector(".back-link-label");
        if (link) link.setAttribute("href", path);
        if (labelEl) labelEl.textContent = "Back to " + label;
      });
    </script> <main class="preview-body">  <iframe src="https://govalta.github.io/goa-public-form-playground/" class="iframe-fill" title="Public form live preview" loading="lazy"></iframe>  </main></body></html>
