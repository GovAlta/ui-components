name: Main Release

on:
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: main-release
  cancel-in-progress: false

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install npm 11
        run: npm install -g npm@11

      - run: npm ci

      - name: Get last successful commit
        uses: nrwl/nx-set-shas@v4
        id: last_successful_commit
        with:
          main-branch-name: ${{ github.ref_name }}

      - name: Build
        run: npm run build:prod

      - name: Fix web-component lib README
        run: cp libs/web-components/README.md dist/libs/web-components

      - name: Release libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx nx affected --target release --parallel=false --base=${{ steps.last_successful_commit.outputs.base }}

      - name: Prepare MCP release
        run: |
          web_tag=$(git tag --points-at HEAD --list "web-components-v*" --sort=-v:refname | head -n 1)
          if [ -z "$web_tag" ]; then echo "No web-components release tag found at HEAD"; exit 1; fi
          web_version="${web_tag#web-components-v}"
          npm --prefix ./dist/libs/design-system-mcp version "$web_version" --no-git-tag-version

      - name: Validate MCP package
        run: node libs/design-system-mcp/scripts/smoke-test.mjs

      - name: Publish MCP package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./dist/libs/design-system-mcp --tag latest --registry https://registry.npmjs.org/ --//registry.npmjs.org/:_authToken="$NPM_TOKEN"

  release-docs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install npm 11
        run: npm install -g npm@11

      - run: npm ci

      - name: Build
        run: npm run build:prod

      - name: Install oc CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Oc login
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.ARO_SERVER }}
          openshift_token: ${{ secrets.ARO_TOKEN }}
          namespace: ui-components-build

      - name: Start Build
        run: |
          oc start-build design-system-docs --from-dir dist/docs --follow --wait

      - name: Create ImageStream
        run: |
          oc get imagestream design-system-docs || oc create imagestream design-system-docs

      - name: Tag Prod
        run: oc tag design-system-docs:latest design-system-docs:prod

      - name: Publish docs
        run: |
          oc project ui-components-prod
          oc rollout latest dc/design-system-docs
